version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bookstore-sqlserver
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "14333:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${DB_PASSWORD} -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    build: ./api-gateway
    container_name: bookstore-gateway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SERVICES_AUTH_URL: http://auth-service:8081
      SERVICES_USER_URL: http://user-service:8082
    depends_on:
      - auth-service
      - user-service

  auth-service:
    build: ./auth-service
    container_name: bookstore-auth
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=db_auth;encrypt=false;trustServerCertificate=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}
      SERVICES_USER_URL: http://user-service:8082
    depends_on:
      sqlserver:
        condition: service_healthy

  user-service:
    build: ./user-service
    container_name: bookstore-user
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=db_user;encrypt=false;trustServerCertificate=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      SERVICES_AUTH_URL: http://auth-service:8081
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver_data:
